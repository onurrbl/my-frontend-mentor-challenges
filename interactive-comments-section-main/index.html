<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | Interactive comments section</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="./css/mainstyles.css">

  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

  <main id="app" class="app" aria-live="polite">
    <!-- Comments render here via js/render.js -->
  </main>


  <div class="container__main">
    <div class="container__main__header">
      <h1>Comments</h1>
    </div>
    <div class="comment_item">
      <div class="comment_item__header">
        <div class="user_avatar">
          <img src="./images/avatars/image-amyrobson.png" alt="User Avatar">
        </div>
        <span class="user_name__text">amyrobson</span>


        <div class="comment_item_time"><span class="time_text">1 month ago</span></div>
      </div>
    </div>
    <div class="container__main__content">

    </div>

  </div>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Your Name Here</a>.
  </footer>

  <script type="module" src="./js/main.js"></script>
</body>

</html>
